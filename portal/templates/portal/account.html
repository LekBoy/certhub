{% extends "base.html" %}
{% block title %}A minha conta{% endblock %}
{% block heading %}A minha conta{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl space-y-6">
  <form method="post" class="card flex flex-col gap-5 p-6">{% csrf_token %}
    <div><label class="label">Utilizador</label><p class="text-sm text-slate-700">{{ user.username }}</p></div>
    <div class="grid gap-5 sm:grid-cols-2">
      <div><label class="label" for="first_name">Nome</label><input id="first_name" name="first_name" value="{{ user.first_name }}" class="block w-full rounded-lg border-slate-300 text-sm shadow-sm focus:border-indigo-500 focus:ring-indigo-500"></div>
      <div><label class="label" for="last_name">Apelido</label><input id="last_name" name="last_name" value="{{ user.last_name }}" class="block w-full rounded-lg border-slate-300 text-sm shadow-sm focus:border-indigo-500 focus:ring-indigo-500"></div>
    </div>
    <div><label class="label" for="email">E-mail</label><input id="email" type="email" name="email" value="{{ user.email }}" class="block w-full rounded-lg border-slate-300 text-sm shadow-sm focus:border-indigo-500 focus:ring-indigo-500"></div>
    <div><label class="label">Grupos</label><p class="text-sm text-slate-700">{% for g in user.groups.all %}<span class="badge-slate mr-1">{{ g.name }}</span>{% empty %}—{% endfor %}</p></div>
    <div class="flex justify-between"><a href="{% url 'portal:password' %}" class="btn-secondary">Alterar palavra-passe</a><button class="btn-primary">Guardar</button></div>
  </form>
</div>
{% endblock %}
