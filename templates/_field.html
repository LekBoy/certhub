<div>
  {% if field.field.widget.input_type == "checkbox" and not field.field.widget.allow_multiple_selected %}
    <label class="flex items-start gap-3 text-sm">
      <span class="mt-0.5">{{ field }}</span>
      <span><span class="font-medium text-slate-700">{{ field.label }}</span>
        {% if field.help_text %}<span class="block text-xs text-slate-500">{{ field.help_text }}</span>{% endif %}</span>
    </label>
  {% else %}
    <label class="label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<p class="mt-1 text-xs text-slate-500">{{ field.help_text }}</p>{% endif %}
  {% endif %}
  {% for e in field.errors %}<p class="mt-1 text-xs text-red-600">{{ e }}</p>{% endfor %}
</div>
